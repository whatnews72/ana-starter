<script>/* iframe(교차출처) 임베드 지원: ?t=토큰으로 로드되면 쿠키 없이도 API 인증 */
(function(){var t=new URLSearchParams(location.search).get("t");if(!t)return;window.__ANA_T=t;
var f=window.fetch;window.fetch=function(u,o){try{if(typeof u==="string"&&(u.charAt(0)==="/"||u.slice(0,5)==="data/")&&!/[?&]t=/.test(u)){u+=(u.indexOf("?")<0?"?":"&")+"t="+encodeURIComponent(t);}}catch(e){}return f.call(this,u,o);};})();</script>
<script>/* GitHub Pages 정적 모드: 서버 없이 번들된 JSON 데이터 로드 */
(function(){var STATIC_MODE=/\.github\.io$/.test(location.hostname);if(!STATIC_MODE)return;window.STATIC_MODE=true;if(document.body){document.body.classList.add("static-mode");}else{document.addEventListener('DOMContentLoaded',function(){document.body.classList.add("static-mode");});}var origFetch=window.fetch;window.fetch=function(url,opts){if(typeof url!=="string")return origFetch.call(this,url,opts);if(url==="/api/vocab"){return fetch("data/vocab.json").then(r=>r.json()).then(data=>new Response(JSON.stringify({words:data.words||[],due:data.words?.filter(w=>!w.nextReview||new Date(w.nextReview)<=new Date())||[]}),{status:200,headers:{"Content-Type":"application/json"}}));}if(url==="/api/state"||url==="/api/evolve"||url==="/api/feed"||url.includes("/api/feed?")){return Promise.resolve(new Response(JSON.stringify({}),{status:200,headers:{"Content-Type":"application/json"}}));}if(url.startsWith("/api/")&&opts&&(opts.method==="POST"||opts.method==="PUT")){return Promise.resolve(new Response(JSON.stringify({}),{status:200,headers:{"Content-Type":"application/json"}}));}return origFetch.call(this,url,opts);};})();</script>

<script>
/* ===== 정보구조 =====
   top(board): secretary(비서) | memo(메모)
   sub chip(channel): 할일/스케줄 (비서) · 업무/공부 (메모)
   item: {id, board, channel, title, sender, priority, due, dueLabel, done, summary} */
const SUBS = { secretary:[["all","전체"],["할일","할일"],["스케줄","스케줄"]],
               memo:[["all","전체"],["업무","업무"],["공부","공부"]] };
const CH2BOARD = { "할일":"secretary","스케줄":"secretary","업무":"memo","공부":"memo" };

let DATA = { version: 0, items: [] };
let lastMsg = 0, curId = null;
let curTop = "secretary", filterCh = "all", activeTab = "live";
let sortMode = localStorage.getItem("ana_sort") || "urgent";
let VOCAB_ALL = [], VOCAB_DUE = [], vocabQueue = [], vocabIdx = 0, vocabFlip = false, vocabTick = 0;

const $ = s => document.querySelector(s);
function esc(t){ return String(t==null?"":t).replace(/[&<>]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove("on"),1900); }

async function loadState(){ try{ const r=await fetch("/api/state"); DATA=await r.json(); render(); if(curId) fillDetail(curId); updateBadge(); }catch(e){} }
function updateBadge(){
  try{ if("setAppBadge" in navigator){ const n=(DATA.items||[]).filter(i=>!i.done).length;
    if(n) navigator.setAppBadge(n).catch(()=>{}); else navigator.clearAppBadge().catch(()=>{}); } }catch(e){}
}

/* ---- 정렬 ---- */
function rank(it){ return ({high:3,mid:2,low:1})[it.priority]||1; }
function dueKey(it){ return it.due ? it.due : "9999"; }
function sortItems(list){
  const a=[...list];
  if(sortMode==="urgent") a.sort((x,y)=> (x.done-y.done) || (rank(y)-rank(x)) || dueKey(x).localeCompare(dueKey(y)) || (x.createdAt||"").localeCompare(y.createdAt||""));
  else a.sort((x,y)=> (x.done-y.done) || (y.createdAt||"").localeCompare(x.createdAt||""));
  return a;
}

/* ---- 서브 칩(필터바) ---- */
function renderChips(){
  const subs=SUBS[curTop]||[];
  $("#filterbar").innerHTML=subs.map(([ch,lab])=>
    '<button data-ch="'+ch+'"'+(ch===filterCh?' class="on"':'')+'>'+lab+' <span class="fn"></span></button>').join("");
  $("#filterbar").querySelectorAll("button").forEach(b=> b.onclick=()=>{ filterCh=b.dataset.ch;
    $("#filterbar").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); render(); });
}

/* ---- 렌더 ---- */
function render(){
  const items=(DATA.items||[]).filter(i=>i.board===curTop);
  const live=items.filter(i=>!i.done), doneL=items.filter(i=>i.done);
  updateBadges();
  $("#donebar").classList.toggle("on", activeTab==="done");
  let base = activeTab==="done" ? doneL : live;
  $("#filterbar").querySelectorAll("button").forEach(b=>{ const ch=b.dataset.ch;
    const n = ch==="all" ? base.length : base.filter(i=>i.channel===ch).length;
    const s=b.querySelector(".fn"); if(s) s.textContent=n; });
  if(filterCh!=="all") base = base.filter(i=>i.channel===filterCh);
  const list = sortItems(base);
  let html;
  if(!list.length) html='<div class="empty">'+(activeTab==="done"?"완료된 항목이 없습니다":"항목이 없습니다")+'</div>';
  else { html='<div class="sec">'; for(const it of list) html+=itemHtml(it); html+='</div>'; }
  $("#board").innerHTML=html;
  document.querySelectorAll(".item").forEach(el=> el.onclick=()=>openDetail(el.dataset.id));
}
function badge(it){ if(!it.dueLabel) return ""; const warm=it.priority==="high";
  return '<span class="pill '+(warm?"badge-warm":"badge-cool")+'">'+esc(it.dueLabel)+'</span>'; }
function itemHtml(it){
  return '<div class="item card '+(it.done?"done":"")+'" data-id="'+it.id+'">'
   +'<div class="body"><div class="titleline">'
     +(it.priority==="high"&&!it.done?'<span class="dot-urg"></span>':'')
     +'<span class="chan-chip chan-'+esc(it.channel)+'">'+esc(it.channel)+'</span>'
     +'<span class="title">'+esc(it.title)+'</span></div>'
   +'<div class="sub2"><span class="sender">'+esc(it.sender||"")+'</span>'+badge(it)+'</div>'
   +'</div></div>';
}
function updateBadges(){
  const set=(id,n)=>{ const el=$(id); if(!el)return; el.textContent=n>99?"99+":n; el.classList.toggle("show", n>0); };
  const items=DATA.items||[];
  set("#badge-secretary", items.filter(i=>i.board==="secretary"&&!i.done).length);
  set("#badge-memo", items.filter(i=>i.board==="memo"&&!i.done).length);
}
async function toggleDone(id, done){ const it=(DATA.items||[]).find(x=>x.id===id); if(it){it.done=done; render();}
  try{ await fetch("/api/done",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,done})}); }catch(e){} }

/* ---- 상세 ---- */
function fillDetail(id){
  const it=(DATA.items||[]).find(x=>x.id===id); if(!it) return;

(function(){

/* ---- 채팅 피드 ---- */
function scrollFeed(){ const f=$("#feed"); setTimeout(()=>{ if(f) f.scrollTop=f.scrollHeight; },30); }
function md(t){
  let s=esc(t||"");
  s=s.replace(/```[a-z]*\n?([\s\S]*?)```/g,(_,c)=>'<pre class="md-pre">'+c.trim()+'</pre>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/`([^`\n]+)`/g,'<code class="md-code">$1</code>');
  s=s.replace(/^\s*[-•]\s+(.+)$/gm,'<div class="md-li">•&nbsp;$1</div>');
  s=s.replace(/\n/g,'<br>');
  s=s.replace(/(<\/div>)<br>/g,'$1').replace(/<br>(<div class="md-)/g,'$1').replace(/(<\/pre>)<br>/g,'$1');
  return s;
}
function renderMsg(m){ if(m.id&&m.id<=lastMsg) return; if(m.id) lastMsg=Math.max(lastMsg,m.id); const f=$("#feed");
  if(m.kind==="proposal"){ f.insertAdjacentHTML("beforeend",propHtml(m)); bindProp(m); }
  else if(m.kind==="syscall"){ f.insertAdjacentHTML("beforeend",'<div class="syscall"><span class="sc-ic">⟳</span><code>'+esc(m.text)+'</code></div>'); }
  else if(m.kind==="itemref"){ const r=m.ref||{};
    f.insertAdjacentHTML("beforeend",'<div class="msg user itemref"><div class="ir-act">'+esc(m.action||"요청")+'</div><div class="ir-chip"><span class="chan-chip chan-'+esc(r.channel)+'">'+esc(r.channel)+'</span><span class="ir-t">'+esc(r.title||"")+'</span><span class="ir-s">'+esc(r.sender||"")+'</span></div>'+(m.text?'<div class="ir-q">'+esc(m.text)+'</div>':'')+'</div>'); }
  else{ const cls=m.role==="user"?"user":(m.role==="system"?"system":"assistant"); f.insertAdjacentHTML("beforeend",'<div class="msg '+cls+'">'+md(m.text)+'</div>'); }
  scrollFeed(); }
function propHtml(m){ const d=m.diff||{}; let rows="";
  (d.add||[]).forEach(a=>rows+='<div class="row"><span class="k k-add">추가</span><span>'+esc(a.title||JSON.stringify(a))+'</span></div>');
  (d.update||[]).forEach(u=>rows+='<div class="row"><span class="k k-up">변경</span><span>'+esc((u.title||u.id)+(u.done!==undefined?(u.done?" → 완료":" → 미완료"):""))+'</span></div>');
  (d.remove||[]).forEach(id=>rows+='<div class="row"><span class="k k-rm">삭제</span><span>'+esc(id)+'</span></div>');
  const st=m.status==="applied"?'<div class="state">✓ 적용됨</div>':m.status==="rejected"?'<div class="state">취소됨</div>':'';
  return '<div class="prop '+(m.status||"pending")+'" data-mid="'+m.id+'"><div class="pt">'+esc(m.text||"변경 제안")+'</div>'+rows+'<div class="acts"><button class="ok">승인</button><button class="no">거절</button></div>'+st+'</div>'; }
function bindProp(m){ const el=document.querySelector('.prop[data-mid="'+m.id+'"]'); if(!el)return; el.querySelector(".ok").onclick=()=>decide(m.id,"approve"); el.querySelector(".no").onclick=()=>decide(m.id,"reject"); }

async function sendChat(){ const inp=$("#chatIn"); const t=inp.value.trim();

  let body;
  if(chatAttach){ const it=chatAttach;
    const payload="[관련 항목 #"+it.id+" · "+it.channel+" · "+(it.sender||"")+"] "+it.title+(it.summary?(" — "+it.summary):"")+(t?("\n질문: "+t):"");
    body={text:payload, ref:{id:it.id,channel:it.channel,sender:it.sender,title:it.title}, action:"대화", displayText:t};
    chatAttach=null; renderAttachChip();
  } else { body={text:t}; }
  inp.value=""; growChat();
  if(pendingFile){ const pf=pendingFile; pendingFile=null; renderFileChip();
    try{ await fetch("/api/upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:pf.name,data:pf.b64,text:t})}); }catch(e){}
    poll(); return; }
  try{ await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); }catch(e){} poll(); }

async function renderEvolve(){
  try{ const fr=await fetch("/api/feed?since=0"); const fj=await fr.json(); evoFeedN=(fj.messages||[]).length; }catch(e){}

  try{ const r=await fetch("/api/evolve"); const j=await r.json(); EVOLVE_LIST=j.proposals||[]; }catch(e){ EVOLVE_LIST=[]; }

function evoCtaState(){

/* ---- 영단어 학습 ---- */
function updateVocabBadge(){ const el=$("#badge-vocab"); if(!el) return;
  const n=VOCAB_DUE.length; el.textContent=n>99?"99+":n; el.classList.toggle("show", n>0); }
function speakWord(text){
  if(!("speechSynthesis" in window) || !text){ toast("이 브라우저는 발음 재생을 지원하지 않아요"); return; }
  try{
    const ss=window.speechSynthesis;
    const doSpeak=()=>{
      try{
        ss.cancel();
        const u=new SpeechSynthesisUtterance(text);
        u.lang="en-US"; u.rate=0.9;
        const voices=ss.getVoices();
        const en=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("en"));
        if(en) u.voice=en;
        u.onerror=()=>toast("발음 재생에 실패했어요 (기기 TTS 설정을 확인해보세요)");
        ss.speak(u);
      }catch(e){ toast("발음 재생에 실패했어요"); }
    };
    if(ss.getVoices().length===0){
      let done=false;
      ss.onvoiceschanged=()=>{ if(done)return; done=true; doSpeak(); };
      setTimeout(()=>{ if(!done){ done=true; doSpeak(); } },300);
    } else { doSpeak(); }
  }catch(e){ toast("발음 재생에 실패했어요"); }
}
function bindVocabSpeak(){
  document.querySelectorAll("[data-speak]").forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); speakWord(b.dataset.speak); });
}
async function fetchVocab(renderIt){
  try{ const r=await fetch("/api/vocab"); const j=await r.json();
    VOCAB_ALL=j.words||[]; VOCAB_DUE=j.due||[]; updateVocabBadge();
    // renderIt===false means "just refresh badge/list in the background" (called
    // from poll() and after answering a card) — must NOT touch the in-progress
    // review queue/index, or the active card silently shifts under the user
    // (this was the "뜻 보기 → skips a card" bug: the queue array got swapped
    // out from under a stale vocabIdx).
    if(renderIt!==false){
      vocabQueue=VOCAB_DUE.slice(); vocabIdx=0; vocabFlip=false;
      if(curTop==="vocab") renderVocab();
    }
  }catch(e){}
}

  let h='<div class="vlist">';
  VOCAB_ALL.slice().sort((a,b)=>(a.nextReview||"").localeCompare(b.nextReview||"")).forEach(w=>{
    h+='<div class="vli" data-id="'+esc(w.id)+'"><button class="vspeak" data-speak="'+esc(w.word)+'" aria-label="발음 듣기">🔊</button><span class="vw">'+esc(w.word)+'</span><span class="vm">'+esc(w.meaning||"")+'</span><span class="vbox">Lv'+String(w.box||1)+'</span><button class="vx" data-vx="'+esc(w.id)+'" aria-label="삭제">×</button></div>';
  });
  h+='</div>'; return h;
}
function bindVocabList(){
  document.querySelectorAll('[data-vx]').forEach(b=> b.onclick=async()=>{
    try{ await fetch("/api/vocab/remove",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:b.dataset.vx})}); }catch(e){}
    fetchVocab();
  });
}
function renderVocab(){
  const m=$("#vocabMain"); if(!m) return;
  if(vocabIdx>=vocabQueue.length){
    m.innerHTML=(vocabQueue.length?'<div class="vdone">오늘 복습 끝! 🎉 '+vocabQueue.length+'개 완료</div>':'<div class="vdone">오늘 복습할 단어가 없어요</div>')+vocabAddHtml()+vocabListHtml();
    bindVocabAdd(); bindVocabList(); bindVocabSpeak(); return;
  }
  const w=vocabQueue[vocabIdx];
  let html='<div class="vprog">'+(vocabIdx+1)+' / '+vocabQueue.length+'</div><div class="vcard"><div class="vword-row"><div class="vword">'+esc(w.word)+'</div><button class="vspeak" data-speak="'+esc(w.word)+'" aria-label="발음 듣기">🔊</button></div>';
  if(vocabFlip){
    html+='<div class="vmeaning">'+esc(w.meaning||"(뜻 미등록)")+'</div>';
    if(w.example) html+='<div class="vexample-row"><div class="vexample">'+esc(w.example)+'</div><button class="vspeak vspeak-sm" data-speak="'+esc(w.example)+'" aria-label="예문 발음 듣기">🔊</button></div>';
    if(w.exampleKo) html+='<div class="vexample-ko">'+esc(w.exampleKo)+'</div>';
    html+='<div class="vrow"><button class="vbtn vno" id="vNo">다시</button><button class="vbtn vyes" id="vYes">기억남</button></div>';
  } else { html+='<button class="vflip" id="vFlip">뜻 보기</button>'; }
  html+='</div>'+vocabAddHtml()+vocabListHtml();
  m.innerHTML=html;
  if(vocabFlip){
    $("#vNo").onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); vocabGuarded(()=>vocabAnswer(w,false)); };
    $("#vYes").onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); vocabGuarded(()=>vocabAnswer(w,true)); };
  } else {
    $("#vFlip").onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); vocabGuarded(()=>{ vocabFlip=true; renderVocab(); }); };
  }
  bindVocabAdd(); bindVocabList(); bindVocabSpeak();
}
/* 모바일에서 버튼이 탭 위치 그대로 교체되면서 같은 탭이 새 버튼까지 이어서 누르는
   문제(고스트 클릭) 방지 — 렌더 직후 짧게 클릭을 무시한다. */
let vocabLock=false;
function vocabGuarded(fn){
  if(vocabLock) return;
  vocabLock=true; fn();
  setTimeout(()=>{ vocabLock=false; },350);
}
async function vocabAnswer(w,correct){
  try{ await fetch("/api/vocab/review",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:w.id,correct})}); }catch(e){}
  vocabIdx++; vocabFlip=false; renderVocab(); fetchVocab(false);
}

/* ---- 폰 알림(Web Push) ---- */
function urlBase64ToUint8Array(base64String){
  const padding="=".repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(base64); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function setupPush(){
  try{
    if(!("serviceWorker" in navigator) || !("PushManager" in window)){ toast("이 브라우저는 알림을 지원하지 않아요"); return; }
    const reg=await navigator.serviceWorker.ready;
    if(Notification.permission==="denied"){ toast("알림이 차단되어 있어요 (브라우저 설정에서 허용해주세요)"); return; }
    const perm=Notification.permission==="granted" ? "granted" : await Notification.requestPermission();
    if(perm!=="granted"){ toast("알림을 허용해주셔야 매일 알림을 받을 수 있어요"); return; }
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      const r=await fetch("/api/vapid-public"); const {publicKey}=await r.json();
      if(!publicKey){ toast("서버에 알림 키가 설정되지 않았어요"); return; }
      sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(publicKey) });
    }
    await fetch("/api/push-subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sub)});
    toast("알림이 켜졌어요 🔔");
  }catch(e){ toast("알림 설정 중 문제가 있었어요"); }
}
$("#vocabPushBtn")?.addEventListener("click", setupPush);

/* ---- 폴링 ---- */
let evTick=0;
async function poll(){ try{ const r=await fetch("/api/feed?since="+lastMsg); const j=await r.json();
  const had=lastMsg; (j.messages||[]).forEach(renderMsg); setTyping(j.status);
  if(j.version&&j.version!==DATA.version) loadState();
  if(curTop==="evolve" && (lastMsg!==had || (++evTick%2===0))) renderEvolve();
  if(curTop!=="vocab" && (++vocabTick%4===0)) fetchVocab(false); }catch(e){} }

renderChips();
loadState(); poll(); setInterval(poll,2500); fetchVocab(false);
</script>
